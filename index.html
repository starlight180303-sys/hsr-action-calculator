const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmt=(n,d=2)=>n==null||Number.isNaN(Number(n))?'-':Number(n).toFixed(d).replace(/\.00$/,'');const baseAV=s=>10000/Math.max(Number(s)||1,1);const rb=(c,r)=>c.mode!=='round'?Infinity:r<=0?0:c.firstRound+Math.max(0,r-1)*c.laterRound;const req=(av,a)=>Math.ceil(10000*a/av);

function sumOpts(){const c=CONTENTS[state.contentKey];if(c.mode!=='round')return '<option value="all">全体</option>';let h='<option value="all">全体</option>';for(let r=0;r<=c.maxRound;r++)h+=`<option value="${r}">${r}R終了まで</option>`;return h}function sumRange(c,total){if(state.summaryRound==='all'||c.mode!=='round')return{limit:total,label:'全体'};const r=+state.summaryRound;return{limit:rb(c,r+1),label:`${r}R終了まで`}}
function render(){const c=CONTENTS[state.contentKey],res=simulate(),range=sumRange(c,res.limit);$('contentTabs').innerHTML=Object.entries(CONTENTS).map(([k,v])=>`<button class="${k===state.contentKey?'active':''}" data-content="${k}">${v.label}</button>`).join('');$('contentNote').textContent=c.description;$('limitBadge').textContent=`計算上限AV ${fmt(res.limit,0)}`;$('presetTarget').innerHTML=targetOpts(state.presetTarget);$('presetTime').value=state.presetTime;$('summaryRound').innerHTML=sumOpts();$('summaryRound').value=state.summaryRound;$('summaryRangeLabel').textContent=range.label;$('partyBox').innerHTML=state.party.map((p,i)=>{const ch=CHARACTERS.find(x=>x.name===p.character)||CHARACTERS[0],active=p.vonwacq&&+p.speed>=120;return`<div class="member"><div class="top"><b><span class="dot d${i}"></span>枠${i+1}</b><span class="pill">基礎AV ${fmt(baseAV(p.speed),2)}</span></div><div class="fields f4"><div><label>この枠のキャラ検索</label><input data-member="${i}" data-field="search" value="${esc(p.search)}" placeholder="例：黄泉"><p class="muted">検索はこの枠のみ</p></div><div><label>キャラクター</label><select data-member="${i}" data-field="character">${optsSlot(i)}</select><p class="muted">${ch.element} / ${ch.path}</p></div><div><label>速度</label><input type="number" step="1" data-member="${i}" data-field="speed" value="${p.speed}"><p class="muted">小数は直接入力</p></div><div><label>ウェンワーク</label><select data-member="${i}" data-field="vonwacq"><option value="false" ${!p.vonwacq?'selected':''}>なし</option><option value="true" ${p.vonwacq?'selected':''}>あり</option></select><p class="muted">${p.vonwacq?(active?'速度120以上：有効':'速度120未満：無効'):'未使用'}</p></div><div><label>開幕行動順UP%</label><input type="number" step="1" data-member="${i}" data-field="startAdvance" value="${p.startAdvance}"></div></div></div>`}).join('');$('presetBox').innerHTML=GENERAL.map((p,i)=>`<button data-preset="${i}">${p.label}</button>`).join('');const visible=SUPPORT.filter(sp=>state.party.some(p=>p.character===sp.character));window.__visibleSupport=visible;$('supportPresetBox').innerHTML=visible.length?visible.map((p,i)=>{const av=supportTime(p.character,state.supportActionNo);return`<button data-support="${i}">${p.label}${av!=null?` #${state.supportActionNo} AV${fmt(av,2)}`:''}</button>`}).join('')+`<div><label>発動する行動回</label><input id="supportActionNo" type="number" step="1" min="1" value="${state.supportActionNo}"></div>`:'<div class="event muted">対象キャラ編成時のみ表示</div>';$('eventCount').textContent=`${state.events.length}件`;$('eventsBox').innerHTML=state.events.length?state.events.map((e,i)=>`<div class="event fields f5"><div><label>名前</label><input data-event="${i}" data-field="name" value="${esc(e.name)}"></div><div><label>発生AV</label><input type="number" step="0.01" data-event="${i}" data-field="time" value="${e.time}"></div><div><label>${e.type==='speedBuff'?'速度UP%':'アップ%'}</label><input type="number" step="1" data-event="${i}" data-field="pct" value="${e.pct}"></div><div><label>対象</label><select data-event="${i}" data-field="target">${targetOpts(e.target,true)}</select></div><button class="danger" data-remove="${i}">削除</button></div>`).join(''):'<div class="event muted">イベントなし</div>';$('targetBox').innerHTML=TARGETS.map(t=>`<div class="box"><b>${t.label}</b><div class="count">速度 ${req(t.av,t.actions)}</div><p class="muted">${t.actions}回 × 10000 ÷ ${t.av}AV。${t.note}</p></div>`).join('');$('summaryBox').innerHTML=res.counts.map((a,i)=>{const n=res.timeline.filter(r=>r.type==='action'&&r.actorId===a.id&&r.time<=range.limit+1e-9).length;return`<div class="box"><div class="top"><b><span class="dot d${i}"></span>${esc(a.label)}</b><span class="count">${n}</span></div><p class="muted">速度 ${a.speed} / 全体 ${a.totalActions}回</p></div>`}).join('');let lh=c.mode==='round'?'-- 0R --（行動値 0）':null,html=c.mode==='round'?`<div class="round">${lh}</div>`:'';res.timeline.forEach(r=>{if(c.mode==='round'){const h=`-- ${r.round}R --（行動値 ${fmt(rb(c,r.round),0)}）`;if(h!==lh){html+=`<div class="round">${h}</div>`;lh=h}}const cl=r.type==='event'?'eventline':r.type==='buff'?'buffline':'';html+=`<div class="row ${cl}"><div><b>${r.type==='event'?'⚡ '+esc(r.name):r.type==='buff'?'🟢 '+esc(r.name):esc(r.character)+' 行動 #'+r.actionNo}</b><p class="muted">${r.type==='event'?`対象 ${r.target==='all'?'全体':'枠'+r.target} / 行動順UP ${fmt(r.pct,0)}%${r.source?' / '+esc(r.source):''}`:r.type==='buff'?`対象 ${r.target==='all'?'全体':'枠'+r.target} / 速度+${fmt(r.pct,0)}% / ${r.durationActions}ターン`:`速度 ${fmt(r.speed,2)}${r.buffed?'（速度バフ中）':''}${c.mode==='round'?' / '+r.round+'R':' / 残り '+fmt(r.remainingCounter,2)}`}</p></div><span class="pill">AV ${fmt(r.time,2)}</span></div>`});$('timelineBox').innerHTML=html}
function updateSlotSelect(i){const sel=document.querySelector(`select[data-member="${i}"][data-field="character"]`);if(sel)sel.innerHTML=optsSlot(i)}
document.addEventListener('compositionstart',()=>state.isComposing=true);document.addEventListener('compositionend',e=>{state.isComposing=false;const t=e.target;if(t.dataset.member!==undefined&&t.dataset.field==='search'){const i=+t.dataset.member;state.party[i].search=t.value;updateSlotSelect(i)}});document.addEventListener('input',e=>{const t=e.target;if(t.id==='presetTime')state.presetTime=t.value;if(t.id==='supportActionNo')state.supportActionNo=Math.max(1,+t.value||1);if(t.dataset.member!==undefined){const i=+t.dataset.member,f=t.dataset.field;if(f==='search'){state.party[i].search=t.value;if(!state.isComposing)updateSlotSelect(i)}if(f==='speed'||f==='startAdvance')state.party[i][f]=t.value}if(t.dataset.event!==undefined)state.events[+t.dataset.event][t.dataset.field]=t.value});document.addEventListener('blur',e=>{const t=e.target;if(t.dataset.member!==undefined||t.dataset.event!==undefined||t.id==='supportActionNo'||t.id==='presetTime')render()},true);document.addEventListener('change',e=>{const t=e.target;if(t.id==='presetTarget')state.presetTarget=t.value;if(t.id==='summaryRound'){state.summaryRound=t.value;render()}if(t.dataset.member!==undefined){const i=+t.dataset.member,f=t.dataset.field;if(f==='character'){setChar(i,t.value);render()}if(f==='vonwacq'){state.party[i].vonwacq=t.value==='true';render()}}if(t.dataset.event!==undefined){state.events[+t.dataset.event][t.dataset.field]=t.value;render()}});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.content){state.contentKey=b.dataset.content;state.summaryRound='all';render()}if(b.id==='resetBtn'){state.contentKey='moc';state.events=[];state.presetTime=0;state.presetTarget='1';state.supportActionNo=1;state.summaryRound='all';state.party=['花火','黄泉','アベンチュリン','フォフォ'].map((name,i)=>{const c=CHARACTERS.find(x=>x.name===name);return{id:i+1,character:name,label:name,speed:c.speed,startAdvance:0,search:'',vonwacq:false}});render()}if(b.id==='manualAdd'){state.events.push({name:'行動順アップ',time:state.presetTime,pct:25,target:'all',type:'advance'});render()}if(b.dataset.preset!==undefined){const p=GENERAL[+b.dataset.preset];state.events.push({name:p.name,time:state.presetTime,pct:p.pct,target:p.target==='all'?'all':state.presetTarget,type:p.type,durationActions:p.durationActions||1});render()}if(b.dataset.support!==undefined){const p=window.__visibleSupport[+b.dataset.support],time=supportTime(p.character,state.supportActionNo);if(time!=null)state.events.push({name:p.name,time,pct:p.pct,target:state.presetTarget,type:'advance',source:`${p.character} #${state.supportActionNo}行動時`});render()}if(b.dataset.remove!==undefined){state.events.splice(+b.dataset.remove,1);render()}});render();
</script></body></html>
